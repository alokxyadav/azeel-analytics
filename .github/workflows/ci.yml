name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, so new advisories surface even when nobody pushes

permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov=app --cov-fail-under=85
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Guards against a silent Tailwind misconfiguration that produces an unstyled site
      - run: test "$(wc -c < "$(ls .next/static/chunks/*.css | head -1)")" -gt 20000
      - run: npm audit --omit=dev --audit-level=high

  # Drives the real site in a real browser: sign-up, upload, charts, downloads, session expiry,
  # layout on a phone, and a WCAG 2.1 AA accessibility audit of every key page in both themes.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  # Builds the real images and checks the running stack, because container files cannot be
  # verified by unit tests.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" > .env
          docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/api/ready
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -c jar -H 'Content-Type: application/json' -d '{"name":"CI User","email":"ci@example.com","password":"ci-smoke-test-9"}' http://localhost:8000/api/auth/signup
          curl -fsS -b jar http://localhost:8000/api/auth/me
      - name: Backup tool works inside the container
        run: docker compose exec -T backend python -m app.scripts.backup --dest /tmp/bk
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
