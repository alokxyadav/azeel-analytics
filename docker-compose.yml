# Local / evaluation setup over plain HTTP. For a public deployment use docker-compose.prod.yml.
services:
  backend:
    build: ./backend
    environment:
      ENV: development            # cookies are not marked Secure, because this setup has no HTTPS
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      FRONTEND_URL: ${SITE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-Azeel Analytics <no-reply@localhost>}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-auto}
    volumes: ["azeel-data:/data"]
    ports: ["8000:8000"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-hello@azeel.tech}
    depends_on:
      backend: { condition: service_healthy }
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  azeel-data:
